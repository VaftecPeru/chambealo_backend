name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - 'audit/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      JWT_SECRET: ci-jwt-secret-chambealo-2026-change-only-for-ci-environment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Validate Composer metadata
        continue-on-error: true
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite
          php artisan config:clear

      - name: PHP syntax
        run: find app routes tests database/migrations -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Migrate
        run: php artisan migrate:fresh --force

      - name: PHPUnit
        run: php artisan test --stop-on-failure
